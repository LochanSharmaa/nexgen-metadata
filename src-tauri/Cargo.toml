[package]
name = "nexgen-metadata"
version = "0.1.0"
edition = "2021"
description = "NexGen Metadata — local web forensic server & analysis engine"
authors = ["NexGen Forensics"]
license = "MIT"

[[bin]]
name = "nexgen-server"
path = "src/main.rs"

[[bin]]
name = "generate_license"
path = "src/bin/generate_license.rs"

[dependencies]
axum               = { version = "0.8", features = ["macros", "tokio"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
uuid               = { version = "1", features = ["v4", "serde"] }
tokio-stream       = "0.1"
futures-util       = "0.3"
async-stream       = "0.3"
rayon              = "1"
crossbeam          = "0.8"
jwalk              = "0.8"

windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_SystemServices",
] }

goblin         = { version = "0.9", default-features = false, features = ["elf", "pe", "mach", "endian_fd"] }
lopdf          = "0.34"
blake3         = "1"
md-5           = "0.10"
sha1           = "0.10"
sha2           = "0.10"
crc32fast      = "1"
xxhash-rust    = { version = "0.8", features = ["xxh3"] }
rusqlite       = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.79"

serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
anyhow         = "1"
thiserror      = "2"
once_cell      = "1"

# Cryptographic License Gate & Auth
ed25519-dalek  = { version = "2", features = ["rand_core", "serde"] }
rand           = "0.8"
base64         = "0.22"
jsonwebtoken   = "9"

chrono         = { version = "0.4", features = ["serde"] }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus       = "1"

[profile.release]
opt-level     = 3
lto           = true
strip         = true
codegen-units = 1
